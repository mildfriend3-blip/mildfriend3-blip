name: Live README showcase

# Rebuilds the project showcase in README.md: ranked by recent commits, with
# repositories that have no description or no recent activity hidden.
#
# Runs once a day, on demand, and after a push to main. It was every five
# minutes before, which burned Actions minutes for a list that changes daily
# at most.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily

permissions:
  contents: write

concurrency:
  group: live-readme
  cancel-in-progress: true

jobs:
  sync:
    # The commit below carries [skip ci], so this does not loop on its own push.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rank projects and rebuild README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python update_readme.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README already up to date"
            exit 0
          fi
          git commit -m "chore(readme): rebuild the project showcase [skip ci]"
          git push
